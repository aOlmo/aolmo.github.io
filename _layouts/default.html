<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="/favicon.ico">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/imgs/me.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="stylesheet" href="/assets/css/site.css">

  {%- if site.google_analytics and jekyll.environment == "production" %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {%- endif %}
</head>
<body>
<div class="wrap">
  <header>
    <a href="/"><img src="/assets/imgs/me.jpg" alt="Photo of {{ site.title }}" width="112" height="112"></a>
    <div>
      <h1><a href="/">{{ site.title }}</a></h1>
      <p class="role">{{ site.role }}</p>
      <nav class="links" aria-label="Links">
        <a href="mailto:{{ site.email }}">{% include icons/envelope.svg %} Email</a>
        {%- for link in site.data.links %}
        <a href="{{ link.url }}">{% include icons/{{ link.icon }}.svg %} {{ link.label }}</a>
        {%- endfor %}
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
</div>
</body>
</html>
