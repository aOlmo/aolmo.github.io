- title: Data Scientist & Scrum Leader @ Vianai Systems
  start: Jan 2023
  end: May 2026
  logo: /assets/imgs/vianai-logo.png
  logo_full: true
  description: >-
    Built backend features for Vianai's AI financial assistant to make it smoother to use and
    more context-aware, from automatic data-source selection and more reliable conversational
    Q&amp;A to client-configurable conversations and custom questions. As Scrum leader, drove
    feature planning and delivery. Tech: Python, Snowflake, OpenSearch, ClickHouse, Kubernetes.

- title: Machine Learning Research Intern @ National Laboratory of the Rockies (former NREL)
  logo: /assets/imgs/nlr-tile.png
  logo_full: true
  start: May 2022
  end: Aug 2022
  description: >-
    Developed physics-informed autoencoders to compress large turbulent-flow (CFD) simulation data.
    Adding physics-based regularizations, such as enforcing incompressibility and preserving
    enstrophy, made the compressed data more physically faithful without hurting reconstruction
    quality, made the model easier to explain, and sped up training by up to 12x.

- title: Business Analytics/Statistics Intern @ University of Phoenix
  logo: /assets/imgs/phoenix-tile.png
  logo_full: true
  start: May 2021
  end: Aug 2021
  description: >-
    As a business analytics and statistics intern, developed and deployed machine learning models
    that identified and segmented users from graph and tabular data, grouping them into categories
    for the business and statistical analysis of the university's user base.

- title: Graduate Research Assistant @ ASU
  logo: /assets/imgs/asu-tile.png
  logo_full: true
  start: Aug 2018
  end: Dec 2022
  description: >-
    Researched when and why large deep learning models fail, across large language models,
    computer vision and automated planning, at the
    <a href="https://yochan-lab.github.io/home/">Planning and Artificial Intelligence (Yochan) lab</a>
    under the supervision of Prof. <a href="http://rakaposhi.eas.asu.edu/">Subbarao Kambhampati</a>.

- title: Graduate Research Assistant @ UAB
  logo: /assets/imgs/uab-tile.png
  logo_full: true
  start: Jan 2018
  end: Jun 2018
  description: >-
    Worked under the supervision of Prof. <a href="https://webs.uab.cat/hpca4se/es/personal/eduardo-cesar-2/">Eduardo César Galobardes</a>.
    Prepared the first stable release (v1.0) of
    <a href="https://github.com/HPCA4SE-UAB/MATE">MATE</a>, a tool that monitors, analyzes and tunes
    parallel MPI applications while they run: built its configure and Makefile toolchain with dependency
    checks (Dyninst, PAPI, libdwarf), and added Doxygen documentation, a user guide, a reference manual
    and example tunlets.

