- title: Machine Learning Research Intern @ National Laboratory of the Rockies (former NREL)
  logo: /assets/imgs/nlr-tile.png
  logo_full: true
  start: May 2022
  end: Aug 2022
  description: >-
    Developed physics-informed autoencoders to compress large turbulent-flow (CFD) simulation data.
    Adding physics-based regularizations, such as enforcing incompressibility and preserving
    enstrophy, made the compressed data more physically faithful without hurting reconstruction
    quality, made the model easier to explain, and sped up training by up to 12x.

