- title: Graduate Research Assistant @ ASU
  logo: /assets/imgs/asu-logo.png
  start: Aug 2018
  end: Dec 2022
  description: >-
    Researched when and why large deep learning models fail at the
    <a href="https://yochan-lab.github.io/home/">Planning and Artificial Intelligence (Yochan) lab</a>,
    under the supervision of Prof. <a href="http://rakaposhi.eas.asu.edu/">Subbarao Kambhampati</a>.
    Highlights: <a href="https://doi.org/10.52202/075280-1693">PlanBench</a>, an extensible benchmark
